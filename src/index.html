<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Dominion</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/examples/jsm/": "/node_modules/three/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <header>
        <h1>Digital Dominion</h1>
        <nav>
            <button id="new-simulation">New Simulation</button>
            <input type="number" id="seed-input" value="3" min="1">
            <button id="controls">Controls</button>
        </nav>
    </header>

    <main>
        <div id="simulation-container">
            <div id="world-view"></div>
            <div id="controls-panel">
                <div class="control-group">
                    <h3>Movement Controls</h3>
                    <div class="control-item">
                        <span class="control-action">Move Forward</span>
                        <span class="control-key">W / ↑</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Move Backward</span>
                        <span class="control-key">S / ↓</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Move Left</span>
                        <span class="control-key">A / ←</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Move Right</span>
                        <span class="control-key">D / →</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Move Up</span>
                        <span class="control-key">Space</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Move Down</span>
                        <span class="control-key">Shift</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>View Controls</h3>
                    <div class="control-item">
                        <span class="control-action">Toggle Top-Down View</span>
                        <span class="control-key">T</span>
                    </div>
                    <div class="control-item">
                        <span class="control-action">Speed Boost</span>
                        <span class="control-key">B</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Digital Dominion</p>
    </footer>

    <script src="js/main.js" type="module"></script>
</body>
</html>
